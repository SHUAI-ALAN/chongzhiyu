<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>宠之寓门店后台</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">寓</span>
        <div>
          <strong>宠之寓</strong>
          <small>门店后台</small>
        </div>
      </div>
      <nav>
        <a href="#store">门店</a>
        <a href="#bookings" class="active">预约</a>
        <a href="#users">用户</a>
        <a href="#members">会员</a>
        <a href="#notices">公告</a>
        <a href="#subscribers">订阅</a>
      </nav>
      <p id="storeMeta" class="store-meta"></p>
    </aside>

    <main>
      <header class="topbar">
        <div>
          <p class="eyebrow">Operations</p>
          <h1>预约与客户线索</h1>
        </div>
        <div class="admin-actions">
          <span id="adminName"></span>
          <button id="changeAdminPasswordButton" type="button">修改密码</button>
          <button id="adminLogoutButton" type="button">退出</button>
          <button id="refreshButton">刷新</button>
        </div>
      </header>

      <section class="metrics" id="metrics"></section>

      <section class="panel" id="store">
        <div class="panel-head">
          <div>
            <p class="eyebrow">Store</p>
            <h2>首页门店信息</h2>
          </div>
        </div>
        <form id="storeForm" class="store-form">
          <label>
            <span>门店名称</span>
            <input id="storeBrandName" type="text" maxlength="24" required>
          </label>
          <label>
            <span>营业状态</span>
            <input id="storeStatusInput" type="text" maxlength="16" required>
          </label>
          <label>
            <span>联系电话</span>
            <input id="storePhoneInput" type="text" maxlength="24" required>
          </label>
          <label>
            <span>营业时间</span>
            <input id="storeHoursInput" type="text" maxlength="40" required>
          </label>
          <label class="full">
            <span>门店地址</span>
            <input id="storeAddressInput" type="text" maxlength="80" required>
          </label>
          <label class="full">
            <span>首页标语</span>
            <textarea id="storeSloganInput" maxlength="120"></textarea>
          </label>
          <label>
            <span>首页卡片标题</span>
            <input id="storePromoTitleInput" type="text" maxlength="20">
          </label>
          <label>
            <span>首页卡片内容</span>
            <input id="storePromoTextInput" type="text" maxlength="40">
          </label>
          <label>
            <span>预约提示标题</span>
            <input id="storeBookingTipTitleInput" type="text" maxlength="20">
          </label>
          <label>
            <span>预约提示内容</span>
            <input id="storeBookingTipTextInput" type="text" maxlength="80">
          </label>
          <button type="submit" class="primary">保存门店信息</button>
        </form>
      </section>

      <section class="panel" id="bookings">
        <div class="panel-head">
          <div>
            <p class="eyebrow">Bookings</p>
            <h2>预约记录</h2>
          </div>
          <div class="filters">
            <select id="statusFilter">
              <option value="all">全部状态</option>
              <option value="pending">待确认</option>
              <option value="confirmed">已确认</option>
              <option value="completed">已完成</option>
              <option value="canceled">已取消</option>
            </select>
            <input id="dateFilter" type="date">
          </div>
        </div>
        <div id="bookingList" class="table-shell"></div>
      </section>

      <section class="panel" id="users">
        <div class="panel-head">
          <div>
            <p class="eyebrow">Users</p>
            <h2>用户查询</h2>
          </div>
          <div class="filters">
            <select id="userTypeFilter">
              <option value="all">全部用户</option>
              <option value="member">会员</option>
              <option value="normal">普通用户</option>
            </select>
            <input id="userKeywordFilter" type="search" placeholder="姓名 / 账户名 / 手机号">
          </div>
        </div>
        <div id="userList" class="table-shell"></div>
        <div class="subpanel" id="userOrderPanel" hidden>
          <div class="panel-head">
            <div>
              <p class="eyebrow">Consumption</p>
              <h2 id="userOrderTitle">消费记录</h2>
            </div>
            <div class="pagination">
              <button id="userOrderPrev" type="button">上一页</button>
              <span id="userOrderPageInfo">第 1 / 1 页</span>
              <button id="userOrderNext" type="button">下一页</button>
            </div>
          </div>
          <div id="userOrderList" class="table-shell"></div>
        </div>
      </section>

      <section class="panel" id="members">
        <div class="panel-head">
          <div>
            <p class="eyebrow">Members</p>
            <h2>会员管理</h2>
          </div>
        </div>
        <form id="memberForm" class="member-form">
          <input id="memberAccountName" type="text" placeholder="账户名" maxlength="24" required>
          <input id="memberName" type="text" placeholder="姓名" maxlength="24" required>
          <input id="memberPhone" type="tel" placeholder="手机号" maxlength="11" required>
          <select id="memberLevel">
            <option value="basic">初级会员</option>
            <option value="middle">中级会员</option>
            <option value="senior">高级会员</option>
          </select>
          <input id="memberBalance" type="number" placeholder="余额" min="0" step="0.01" value="0">
          <input id="memberPoints" type="number" placeholder="积分" min="0" step="1" value="0">
          <textarea id="memberRemark" placeholder="备注，例如：常洗护、寄养偏好等" maxlength="120"></textarea>
          <button type="submit" class="primary">新增会员</button>
        </form>
        <div id="memberList" class="member-list-admin"></div>

        <div class="subpanel">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Member Orders</p>
              <h2>会员订单</h2>
            </div>
            <div class="pagination">
              <button id="memberOrderPrev" type="button">上一页</button>
              <span id="memberOrderPageInfo">第 1 / 1 页</span>
              <button id="memberOrderNext" type="button">下一页</button>
            </div>
          </div>
          <form id="memberOrderForm" class="member-order-form">
            <select id="memberOrderMember" required></select>
            <input id="memberOrderTitle" type="text" placeholder="订单内容" maxlength="40" required>
            <input id="memberOrderAmount" type="number" placeholder="金额" min="0" step="0.01" value="0">
            <input id="memberOrderDate" type="date">
            <input id="memberOrderStatus" type="text" placeholder="状态" maxlength="16" value="已完成">
            <input id="memberOrderRemark" type="text" placeholder="备注" maxlength="80">
            <button type="submit" class="primary">新增订单</button>
          </form>
          <div id="memberOrderList" class="table-shell"></div>
        </div>
      </section>

      <section class="panel" id="notices">
        <div class="panel-head">
          <div>
            <p class="eyebrow">Notices</p>
            <h2>门店公告</h2>
          </div>
        </div>
        <form id="noticeForm" class="notice-form">
          <input id="noticeTitle" type="text" placeholder="公告标题" maxlength="24" required>
          <select id="noticeLevel">
            <option value="normal">普通公告</option>
            <option value="important">重要公告</option>
          </select>
          <textarea id="noticeContent" placeholder="公告内容，例如：店主有事，歇业三天，周四恢复营业。" maxlength="160" required></textarea>
          <label class="check-row">
            <input id="noticeEnabled" type="checkbox" checked>
            首页显示
          </label>
          <button type="submit" class="primary">新增公告</button>
        </form>
        <div id="noticeList" class="notice-list-admin"></div>
      </section>

      <section class="panel" id="subscribers">
        <div class="panel-head">
          <div>
            <p class="eyebrow">Leads</p>
            <h2>公众号预约提醒</h2>
          </div>
        </div>
        <div id="subscriberList" class="table-shell"></div>
      </section>
    </main>

    <div class="login-screen" id="loginScreen">
      <form class="login-card" id="adminLoginForm">
        <p class="eyebrow">Admin</p>
        <h2>后台登录</h2>
        <input id="adminUsername" type="text" placeholder="管理员账号" autocomplete="username" required>
        <input id="adminPassword" type="password" placeholder="管理员密码" autocomplete="current-password" required>
        <button type="submit" class="primary">登录</button>
        <p id="loginMessage" class="form-message"></p>
      </form>
    </div>

    <div class="modal" id="adminPasswordModal" hidden>
      <form class="modal-card" id="adminPasswordForm">
        <button class="modal-close" id="adminPasswordClose" type="button">×</button>
        <p class="eyebrow">Security</p>
        <h2>修改管理员密码</h2>
        <input name="currentPassword" type="password" placeholder="原密码" autocomplete="current-password" required>
        <input name="newPassword" type="password" placeholder="新密码，至少 6 位" autocomplete="new-password" minlength="6" required>
        <input name="confirmPassword" type="password" placeholder="再次输入新密码" autocomplete="new-password" minlength="6" required>
        <button type="submit" class="primary">保存密码</button>
        <p id="adminPasswordMessage" class="form-message"></p>
      </form>
    </div>

    <div id="toast" class="toast"></div>
    <script src="./scripts.js"></script>
  </body>
</html>
